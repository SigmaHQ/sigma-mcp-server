[project]
name = "sigma-mcp-server"
version = "0.2.1"
description = "MCP server for Sigma detection engineering: create, validate and search Sigma rules, and build and test processing pipelines with pySigma"
readme = "README.md"
authors = [
    {name = "Thomas Patzke",email = "thomas@patzke.org"}
]
license = {text = "MIT"}
requires-python = "<4.0,>=3.11"
keywords = ["sigma", "mcp", "detection engineering", "siem", "pysigma", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp (>=4.1.1,<5.0.0)",
    "httpx (>=0.27,<1.0.0)",
    "pysigma (>=2.1.1,<3.0.0)",
    "pyyaml (>=6.0,<7.0)"
]

[project.scripts]
sigma-mcp-server = "sigma.mcp.main:main"

[project.urls]
Homepage = "https://github.com/SigmaHQ/sigma-mcp-server"
Repository = "https://github.com/SigmaHQ/sigma-mcp-server"
Issues = "https://github.com/SigmaHQ/sigma-mcp-server/issues"

[tool.poetry]
packages = [{include = "sigma"}]
include = ["sigma/mcp/data/*.json", "sigma/mcp/py.typed"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "mypy (>=1.20.2,<2.0.0)",
    "types-pyyaml (>=6.0,<7.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["sigma/mcp"]
branch = true

[tool.coverage.report]
fail_under = 95

[tool.mypy]
strict = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
