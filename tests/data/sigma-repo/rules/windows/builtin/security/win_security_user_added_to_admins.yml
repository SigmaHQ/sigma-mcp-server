title: User Added To Local Administrators Group
id: 9d1c2b3a-4e5f-4a6b-8c7d-0e1f2a3b4c03
status: test
description: Detects a user being added to the local Administrators group.
author: Example Author
date: 2021-05-10
tags:
    - attack.persistence
    - attack.t1098
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4732
        TargetUserName|startswith:
            - 'Administr'
            - 'Administrateur'
    condition: selection
level: medium
