title: PsExec Remote Execution
id: 0b5b3d5c-1a8e-4d4c-9f29-3c6c8e0b7a01
status: test
description: Detects remote command execution with Sysinternals PsExec, a common lateral movement technique.
author: Example Author
date: 2023-02-14
tags:
    - attack.execution
    - attack.lateral-movement
    - attack.t1569.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\PsExec.exe'
        - OriginalFileName: 'psexec.c'
    selection_cli:
        CommandLine|contains: '\\'
    filter_main_service:
        ParentImage|endswith: '\services.exe'
    condition: all of selection_* and not filter_main_service
falsepositives:
    - Administrative activity
level: medium
