title: LSASS Memory Dump Via Comsvcs DLL
id: 6c4c5b2e-2f3a-4b8e-8c9d-1e2f3a4b5c02
status: stable
description: Detects dumping of the LSASS process memory using comsvcs.dll MiniDump.
author: Example Author
date: 2022/08/01
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\rundll32.exe'
        CommandLine|contains|all:
            - 'comsvcs'
            - 'MiniDump'
    condition: selection
level: high
