title: Linux Base64 Encoded Shell Command
id: 3a2b1c0d-9e8f-4a7b-b6c5-d4e3f2a1b004
status: experimental
description: Detects base64 decoding piped into a shell.
author: Example Author
date: 2024-01-03
tags:
    - attack.defense-evasion
    - attack.t1140
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        CommandLine|contains|all:
            - 'base64 -d'
            - '| sh'
    condition: selection
level: medium
